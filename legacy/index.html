<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4A90E2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>极简记账</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #4A90E2;
            --danger-color: #FF4D4F;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #999999;
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 80px; }

        /* ===== 顶部预算区 ===== */
        .header { padding: 20px 16px 10px; text-align: center; }
        .progress-container { width: 120px; height: 120px; margin: 0 auto 12px; position: relative; }
        .progress-ring { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--primary-color) 0%, #eee 0% 100%); display: flex; align-items: center; justify-content: center; transition: background 0.5s ease; }
        .progress-inner { width: 90px; height: 90px; border-radius: 50%; background: var(--bg-color); display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .progress-percent { font-size: 22px; font-weight: bold; color: var(--primary-color); }
        .progress-label { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
        .budget-text { font-size: 13px; color: var(--text-sub); cursor: pointer; border-bottom: 1px dashed var(--text-sub); display: inline-block; padding-bottom: 2px; }

        /* ===== 账单列表 ===== */
        .list-container { padding: 0 16px; }
        .empty-state { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 14px; }

        /* 卡片容器（相对定位，承载删除按钮背景） */
        .transaction-card-wrapper {
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            border-radius: var(--border-radius);
        }
        .transaction-card-wrapper.animating {
            transition: transform 0.3s ease, opacity 0.3s ease, max-height 0.3s ease, margin-bottom 0.3s ease;
        }

        /* 红色删除按钮背景 */
        .delete-btn-bg {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 80px;
            background: var(--danger-color);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            border-radius: 0 var(--border-radius) var(--border-radius) 0;
            cursor: pointer;
            z-index: 1;
            user-select: none;
        }

        /* 白色卡片本体 */
        .transaction-card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: var(--border-radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
            will-change: transform;
            touch-action: pan-y;
        }
        .transaction-card.animating {
            transition: transform 0.3s ease, opacity 0.25s ease;
        }

        /* ===== 底部添加按钮 ===== */
        .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 50%; background: var(--primary-color); color: #fff; font-size: 28px; border: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(74,144,226,0.4); cursor: pointer; z-index: 100; }
        .fab:active { transform: translateX(-50%) scale(0.92); }

        /* ===== 弹窗遮罩 ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        /* ===== Action Sheet ===== */
        .action-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); z-index: 300; transform: translateY(100%); transition: transform 0.3s ease; }
        .action-sheet.active { transform: translateY(0); }
        .sheet-title { font-size: 16px; font-weight: 600; text-align: center; margin-bottom: 16px; }

        /* 分类网格 */
        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
        .category-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
        .category-item.selected { background: rgba(74,144,226,0.1); }
        .category-icon { font-size: 24px; }
        .category-name { font-size: 11px; color: var(--text-sub); }
        .category-item.selected .category-name { color: var(--primary-color); font-weight: 600; }

        /* 输入区 */
        .input-group { margin-bottom: 12px; }
        .input-group label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; display: block; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #E8E8E8; border-radius: 10px; font-size: 16px; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: var(--primary-color); }

        /* 按钮组 */
        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-cancel { background: #F0F0F0; color: var(--text-main); }
        .btn-save { background: var(--primary-color); color: #fff; }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- 顶部预算 -->
    <div class="header">
        <div class="progress-container">
            <div class="progress-ring" id="progress-ring">
                <div class="progress-inner">
                    <span class="progress-percent" id="progress-percent">0%</span>
                    <span class="progress-label">已用预算</span>
                </div>
            </div>
        </div>
        <div class="budget-text" id="budget-text">预算: ¥3000 | 已用: ¥0.00</div>
    </div>

    <!-- 账单列表 -->
    <div class="list-container" id="transaction-list">
        <div class="empty-state">还没有账单，点击下方 + 记一笔吧</div>
    </div>

    <!-- 添加按钮 -->
    <button class="fab" id="btn-add">+</button>

    <!-- 弹窗遮罩 -->
    <div class="modal-overlay" id="modal-overlay"></div>

    <!-- Action Sheet -->
    <div class="action-sheet" id="action-sheet">
        <div class="sheet-title">记一笔支出</div>

        <div class="category-grid" id="category-grid"></div>

        <div class="input-group">
            <label>金额</label>
            <input type="number" id="input-amount" placeholder="0.00" inputmode="decimal">
        </div>

        <div class="input-group">
            <label>备注（可选）</label>
            <input type="text" id="input-note" placeholder="午餐、打车..." maxlength="20">
        </div>

        <div class="btn-group">
            <button class="btn btn-cancel" id="btn-cancel">取消</button>
            <button class="btn btn-save" id="btn-save">保存</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
